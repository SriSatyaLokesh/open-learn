name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PRs cancel superseded runs; a newer main push must not abort an in-flight deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, check, build & e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # html reporter writes playwright-report/ for the upload step
      - run: pnpm test:e2e --reporter=list,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  backend:
    name: Supabase-backed tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start

      # Browser env vars are baked in at build time, so export them before `pnpm build` and Playwright's webServer.
      - name: Export local Supabase env
        run: |
          pnpm exec supabase status -o env | sed -E 's/^API_URL="?([^"]*)"?$/PUBLIC_SUPABASE_URL=/p; s/^ANON_KEY="?([^"]*)"?$/PUBLIC_SUPABASE_ANON_KEY=/p; s/^SERVICE_ROLE_KEY="?([^"]*)"?$/SERVICE_ROLE_KEY=/p; d' >> "$GITHUB_ENV"

      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build

      - name: Leak check (service role key must not be in the build)
        run: '! grep -rqF "$SERVICE_ROLE_KEY" build/'

      - run: pnpm test:e2e --project backend --grep-invert @real-youtube

      - name: Real-YouTube smoke (non-gating)
        continue-on-error: true
        run: pnpm test:e2e --project backend --grep @real-youtube

  deploy:
    name: Deploy to Cloudflare (static assets)
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec wrangler deploy

      - name: Notify Missing Cloudflare Secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning title=Missing Cloudflare Credentials::CLOUDFLARE_API_TOKEN secret is not configured. To activate live edge deployment, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under GitHub Settings > Secrets and variables > Actions."
